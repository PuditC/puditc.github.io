# CI ของเว็บ Portfolio (static HTML/CSS/JS → GitHub Pages)
# กลไก deploy อยู่ใน deploy.yml (publish ./site) — ไฟล์นี้เป็นด่าน smoke + security ก่อนเท่านั้น
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every local link in site/ resolves
        run: node scripts/check-links.mjs

  security:
    name: Security (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
