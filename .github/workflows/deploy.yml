name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# The site is plain HTML/CSS/JS in ./site — there is no build step.
# Pages for this repo is served from the `gh-pages` branch (the same target
# `npm run deploy` uses), so the workflow publishes there instead of via
# actions/deploy-pages — that needs the Pages source set to "GitHub Actions".
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
